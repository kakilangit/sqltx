version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - errcheck
    - errorlint
    - exhaustive
    - gocognit
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    cyclop:
      max-complexity: 8
      package-average: 5.0
    gocognit:
      min-complexity: 10
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      confidence: 0.8
      rules:
        - name: exported
          disabled: true
        - name: var-naming

formatters:
  enable:
    - gofmt
    - goimports
